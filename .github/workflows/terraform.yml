name: Terraform

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: infra/terraform
  TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'autovet/production' }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}

jobs:
  apply:
    name: Apply production infrastructure
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require Terraform configuration
        shell: bash
        run: |
          if ! compgen -G "${TF_DIR}/*.tf" > /dev/null; then
            echo "::error::No Terraform configuration was found in ${TF_DIR}."
            exit 1
          fi

      - name: Check required repository variables
        shell: bash
        env:
          ENVIRONMENT_WIF_PROVIDER: ${{ vars.ENVIRONMENT_WIF_PROVIDER }}
          TERRAFORM_SERVICE_ACCOUNT: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          required=(
            ENVIRONMENT_WIF_PROVIDER
            TERRAFORM_SERVICE_ACCOUNT
            TF_STATE_BUCKET
            GCP_PROJECT_ID
            GCP_REGION
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable ${name} is required."
              exit 1
            fi
          done

      - name: Authenticate as Terraform service account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ENVIRONMENT_WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Initialize production state
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Check formatting and validation
        shell: bash
        run: |
          terraform fmt -check -recursive "$TF_DIR"
          terraform -chdir="$TF_DIR" validate

      - name: Create reviewed apply plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -lock-timeout=5m -out=production.tfplan

      - name: Apply production plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -lock-timeout=5m -auto-approve production.tfplan
